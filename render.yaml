services:
  # 1. THE FRONTEND SERVICE (Vite App inside /client)
  - type: web
    name: pestxz-frontend
    env: static
    plan: free
    rootDir: ./client
    buildCommand: npm install && npm run build
    publishDir: ./dist
    routes:
      - type: rewrite
        src: /*
        dest: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.x               # Modern Node runtime for Vite compilation

  # 2. THE BACKEND SERVICE (Express App at Root)
  - type: web
    name: pestxz-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install     # Installs backend dependencies
    startCommand: node server.js  # Runs your main file (using node instead of nodemon)
    envVars:
      - key: NODE_VERSION
        value: 20.x               # FIXED: Modern Node required for Mongoose v8, Sharp, and ES Modules
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
